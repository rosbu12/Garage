# Pubblica la web app (la cartella `web/`) su GitHub Pages.
#
# Dopo il primo run: GitHub -> Settings -> Pages -> "Source" = "GitHub Actions".
# L'indirizzo pubblico compare lì, del tipo:
#   https://<tuo-utente>.github.io/<nome-repo>/
#
# Da quell'indirizzo la puoi aprire sul telefono e installare sulla schermata Home.

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Prepara i file da pubblicare
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy su Pages
        id: deployment
        uses: actions/deploy-pages@v4
